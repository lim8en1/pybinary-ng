[project]
name = "pybinary"
version = "0.1.0"
description = "Declarative binary structures that compile to specialized codecs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "construct>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pybinary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
